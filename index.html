<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador PCP ESA</title>
<style>
:root{--bg:#0b111b;--panel:#121b29;--line:#29374d;--text:#edf3fb;--muted:#8fa0b5;--accent:#8f6cff;--red:#ff6b75;--yellow:#ffc857;--green:#4bd28b}
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 0,#1b2c45 0,transparent 38%),var(--bg);color:var(--text)}
button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:block}.side{position:fixed;z-index:100;left:0;top:0;bottom:0;width:230px;border-right:1px solid var(--line);background:#0b121d;padding:16px 12px;display:flex;flex-direction:column;transform:translateX(-214px);transition:transform .22s ease;box-shadow:10px 0 30px #0006}.side:hover,.side:focus-within{transform:translateX(0)}.side::after{content:"›";position:absolute;right:0;top:50%;width:16px;height:42px;margin-top:-21px;border:1px solid var(--line);border-left:0;border-radius:0 8px 8px 0;background:#121c2b;color:#9b7dff;display:grid;place-items:center;font-size:22px;font-weight:700}.side:hover::after,.side:focus-within::after{content:"‹"}.brand{display:flex;gap:10px;align-items:center;padding:5px 6px 20px}.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#9b7dff,#6348da);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}nav{display:grid;gap:5px}nav button{border:0;background:transparent;color:#b9c6d7;text-align:left;padding:11px;border-radius:9px}nav button:hover{background:#162338;color:#fff}nav button.active{background:#211a43;color:#fff;box-shadow:inset 3px 0 var(--accent)}.sidefoot{margin-top:auto;color:var(--muted);font-size:11px;line-height:1.5;padding:8px}
main{min-width:0;margin-left:16px;transition:margin-left .22s ease}.side:hover ~ main,.side:focus-within ~ main{margin-left:230px}.top{height:66px;border-bottom:1px solid var(--line);background:#0d1522;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.top h1{margin:0;font-size:19px}.top small{color:var(--muted)}.wrap{padding:22px;max-width:1500px;margin:auto}.page{display:none}.page.on{display:block}.hero{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:16px}.hero h2{margin:0 0 5px;font-size:26px}.hero p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#182536;color:#edf3fb;padding:9px 13px;border-radius:9px}.btn:hover{border-color:#4a5f7d}.primary{background:var(--accent);border-color:var(--accent)}.danger{color:#ff9da5;background:#25161b;border-color:#60343c}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(5,1fr)}.kpi{padding:15px}.kpi.filterable{cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}.kpi.filterable:hover{transform:translateY(-1px);border-color:#4a5f7d}.kpi.filterable.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 24px #0004}.card{background:linear-gradient(180deg,#162235,#111b29);border:1px solid var(--line);border-radius:12px;overflow:hidden}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:27px;margin-top:7px}.red{color:var(--red)}.yellow{color:var(--yellow)}.green{color:var(--green)}.two{grid-template-columns:1.1fr .9fr}.head{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}.body{padding:15px}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tablewrap{overflow:auto}.tbl th{position:sticky;top:0;background:#172439;color:#b9c7d8;text-align:left;font-size:10px}.tbl td,.tbl th{padding:8px;border-bottom:1px solid #223149;vertical-align:top}.tbl .obs{background:#fff;color:#111;min-width:100px}.st-atrasada{background:#51273088}.st-vence-hoje{background:#59481d66}.st-proximos-7-dias{background:#5b511f44}.drop{border:1px dashed #4c607d;padding:30px;border-radius:12px;text-align:center;background:#101a28}.drop.drag{border-color:var(--accent);background:#201744}.field{display:grid;gap:5px}.field label{font-size:11px;color:#a0adbf}.field input,.field textarea{width:100%;border:1px solid #2b3a51;border-radius:8px;background:#0e1724;color:#eef3fa;padding:9px}.field textarea{min-height:78px;resize:vertical}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{border:1px solid var(--line);background:#152236;color:#ccd7e4;border-radius:99px;padding:6px 9px;font-size:11px}.delaygrid{grid-template-columns:1fr}.delay{padding:0;background:#111b29;border:1px solid var(--line);border-radius:10px;overflow:hidden}.delay summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px}.delay summary::-webkit-details-marker{display:none}.delay summary::after{content:"＋";color:#9aaac0;font-size:18px}.delay[open] summary::after{content:"−"}.delay-content{padding:0 16px 16px;border-top:1px solid var(--line)}.delay{padding:12px;background:#111b29;border:1px solid var(--line);border-radius:10px}.pill{border:1px solid var(--line);border-radius:99px;padding:3px 7px;color:#c8d3df;font-size:10px}.empty{padding:28px;text-align:center;color:var(--muted)}.toast{display:none;position:fixed;right:18px;bottom:18px;background:#182436;border:1px solid #415370;padding:11px 13px;border-radius:10px;box-shadow:0 12px 35px #0008}.toast.on{display:block}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.side{position:sticky;left:auto;top:0;bottom:auto;z-index:10;width:auto;transform:none;transition:none;border-right:0;border-bottom:1px solid var(--line);padding:8px;box-shadow:none}.side::after{display:none}.side:hover,.side:focus-within{transform:none}.side:hover ~ main,.side:focus-within ~ main{margin-left:0}.sidefoot{display:none}.brand{padding:2px 5px 10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.top{height:58px}.wrap{padding:13px}.kpis{grid-template-columns:repeat(2,1fr)}.hero{display:block}.actions{margin-top:10px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand"><div class="logo">ESA</div><div><b>Gerador PCP</b><small>Web • V9.8.7</small></div></div>
 <nav>
  <button class="active" data-page="inicio">🏠 Início</button>
  <button data-page="relatorios">📄 Relatórios</button>
  <button data-page="consultas">🔎 Consultas PCP</button>
  <button data-page="atrasos">⏱️ Gestão de Atrasos</button>
  <button data-page="historico">🕒 Histórico</button>
  <button data-page="config">⚙️ Configurações</button>
  <button data-page="sobre">ℹ️ Sobre</button>
 </nav>
 <div class="sidefoot">Processamento dos PDFs localmente no navegador.<br>Dados desta versão ficam neste navegador.</div>
</aside>
<main>
 <header class="top"><div><h1 id="pageTitle">Início</h1><small>Controle e análise de O.S. do PCP</small></div><small id="topStatus">Pronto</small></header>
 <div class="wrap">
  <section id="inicio" class="page on"></section><section id="relatorios" class="page"></section>
  <section id="consultas" class="page"></section><section id="atrasos" class="page"></section>
  <section id="historico" class="page"></section><section id="config" class="page"></section><section id="sobre" class="page"></section>
 </div>
</main>
</div>
<script src="firebase-config.js"></script>
<input id="fileInput" type="file" accept=".pdf,application/pdf" multiple hidden>
<div id="toast" class="toast"></div>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";
import {jsPDF} from "https://cdn.jsdelivr.net/npm/jspdf@4.2.1/+esm";
import {autoTable} from "https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.8/+esm";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";

const KEY="gerador_pcp_esa_web_v1", DAY=86400000;
const STAT=["Atrasada","Vence hoje","Próximos 7 dias","Prazo futuro","Sem previsão"];
const BR=["WEG","FLYGT","ABS","EBARA","KSB","SULZER","SCHNEIDER","GRUNDFOS","IMBIL","SEW","SIEMENS","VOGES","ASTEN","EBERLE","REALINCE","REALIANCE","MERCO SUL","MERCOSUL","GLASS","ECOFLUX","SPV"];
const BAD=["BOMBA","BOMBAS","MOTOR","MOTORES","MOTOBOMBA","CA","ABS","FLYGT","KSB","WEG","SEW","EBARA","SULZER","SCHNEIDER","GRUNDFOS","IMBIL","SIEMENS","VOGES","EQUIPAMENTO","OFICINA","MANUTENCAO"];
const state={reports:[],delays:{},history:[],page:"inicio",mode:"completo",qrows:[],qdesc:"",homeFilter:""};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateKey=d=>d instanceof Date?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"):d;
const dateObj=s=>s?new Date(s+"T00:00:00"):null;
const dateFmt=s=>s?dateObj(s).toLocaleDateString("pt-BR"):"Sem previsão";
const days=(a,b)=>Math.round((dateObj(b)-dateObj(a))/DAY);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function save(){localStorage.setItem(KEY,JSON.stringify({reports:state.reports,delays:state.delays,history:state.history}));window.dispatchEvent(new CustomEvent("esa:local-save"))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");state.reports=x.reports||[];state.delays=x.delays||{};state.history=x.history||[]}catch{}}
function refDate(){const x=state.reports.map(r=>r.ref_date).filter(Boolean).sort();return x.length?x[x.length-1]:dateKey(today())}
function getStatus(prev,ref){if(!prev)return"Sem previsão";if(prev<ref)return"Atrasada";if(prev===ref)return"Vence hoje";return days(ref,prev)<=7?"Próximos 7 dias":"Prazo futuro"}
function count(rows){const c={};STAT.forEach(s=>c[s]=rows.filter(r=>r.Status===s).length);return c}
function enrich(r,ref){r.Status=getStatus(r["Prev. Entrega"],ref);r["Dias na Fase"]=r["Data Início"]?Math.max(0,days(r["Data Início"],ref)):null;const late=r["Prev. Entrega"]&&r["Prev. Entrega"]<ref?days(r["Prev. Entrega"],ref):0;let score=late?Math.min(65,45+Math.min(late,20)):r["Prev. Entrega"]===ref?42:r["Prev. Entrega"]?(days(ref,r["Prev. Entrega"])<=3?34:days(ref,r["Prev. Entrega"])<=7?24:8):28;const t=r["Dias na Fase"]||0;score+=t>=30?22:t>=15?14:t>=8?7:0;r["Criticidade Score"]=Math.min(100,score);r.Criticidade=score>=70?"Crítica":score>=50?"Alta":score>=30?"Média":"Baixa";const z=state.delays[r["Fase Num"]+"::"+r.OS]||{};r["Motivo Atraso"]=z.motivo||"";r["Observação Atraso"]=z.observacao||"";r["Responsável Atraso"]=z.responsavel||"";r["Ação Atraso"]=z.acao||"";r["Prazo Ação"]=z.prazo||"";return r}
function allRows(){return state.reports.flatMap(r=>r.rows||[]).map(r=>enrich({...r},refDate()))}
function parseDate(s){const m=String(s||"").match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+"-"+m[2]+"-"+m[1]:null}
function isPerson(s){const x=String(s||"").toUpperCase().replace(/[^A-ZÀ-Ú ]/g," ").replace(/\s+/g," ").trim();if(!x||x.includes("BOMBA")||x.includes("MOTOR"))return false;const w=x.split(" ");return w.length>=2&&w.length<=5&&w.every(v=>v.length>=2&&!BAD.includes(v))}
function collaborator(s){const w=String(s||"").replace(/\s+/g," ").trim().split(" ");let cut=w.length;for(let i=0;i<w.length;i++){const t=w[i].toUpperCase().replace(/[^A-ZÀ-Ú]/g,"");if(BAD.includes(t)||t.includes("BOMBA")||t.includes("MOTOR")){cut=i;break}}const c=w.slice(0,cut).join(" ");return isPerson(c)?c:""}
function parseSection(sec,pn,pname){const lines=sec.split(/\r?\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean),rows=[],rowRe=/^(\d{5,8})\s+(\d{5,8})\s+(\d{2}\/\d{2}\/\d{4})\s+(.+)$/,dr=/\d{2}\/\d{2}\/\d{4}/g,total=(sec.match(/Total desta Fase\s*-+>\s*(\d+)/i)||[])[1];for(const line of lines){const m=line.match(rowRe);if(!m||m[1]!==m[2])continue;const dates=Array.from(m[4].matchAll(dr));if(!dates.length)continue;let ini=parseDate(m[3]),hora="",segment="";if(dates[1]){ini=parseDate(dates[1][0]);hora=(m[4].slice(dates[1].index+10).match(/\b\d{2}:\d{2}\b/)||[])[0]||"";segment=m[4].slice(dates[0].index+10,dates[1].index).trim()}let before=m[4].slice(0,dates[0].index).trim().split(/\s+/),powerIndex=-1,powerLen=1;for(let i=0;i<before.length;i++){if(/^\d+(?:[.,]\d+)?$/.test(before[i])&&/^(CV|KW)$/i.test(before[i+1]||"")){powerIndex=i;powerLen=2;break}if(/^\d+(?:[.,]\d+)?(?:CV|KW)$/i.test(before[i])){powerIndex=i;break}}let power="",tension="";if(powerIndex>=0){power=before.slice(powerIndex,powerIndex+powerLen).join(" ");tension=before.slice(powerIndex+powerLen).join(" ");before=before.slice(0,powerIndex)}let cc="";if(/^\d{2,6}$/.test(before[0]||""))cc=before.shift();const bi=before.findIndex(x=>BR.includes(x.toUpperCase()));let marca="",cliente="",modelo="";if(bi>=0){marca=before[bi];cliente=before.slice(0,bi).join(" ");modelo=before.slice(bi+1).join(" ")}else cliente=before.join(" ");const row={OS:m[1],"Data OS":parseDate(m[3]),Cliente:cliente,"Cliente Código":cc,Marca:marca,"Modelo/TAG":modelo,"Potência":power,"Tensão":tension,"Prev. Entrega":parseDate(dates[0][0]),Colaborador:collaborator(segment),"Data Início":ini,"Hora Início":hora,"Fase Num":String(pn),"Fase Nome":pname};if(!rows.some(x=>x.OS===row.OS))rows.push(row)}return{fase_num:String(pn),fase_nome:pname,total_fase:total?+total:rows.length,rows}}
async function pageText(page){const tc=await page.getTextContent(),items=tc.items.filter(x=>x.str&&x.str.trim());items.sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]);const groups=[];for(const it of items){let g=groups.find(x=>Math.abs(x.y-it.transform[5])<=2.5);if(!g){g={y:it.transform[5],items:[]};groups.push(g)}g.items.push(it)}return groups.sort((a,b)=>b.y-a.y).map(g=>g.items.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(" ").replace(/\s+/g," ").trim()).filter(Boolean).join("\n")}
async function readPdf(file){const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;let text="";for(let i=1;i<=pdf.numPages;i++)text+=await pageText(await pdf.getPage(i))+"\n";const em=text.match(/Emissao:\s*(\d{2}\/\d{2}\/\d{4})\s*-\s*(\d{2}:\d{2})/i),rm=text.match(/Referencia:\s*([A-Za-z]{3}\/\d{4})/i),pm=Array.from(text.matchAll(/^Fase:\s*(\d+)\s+(.+?)\s*(?=\s+Periodo de:|$)/gm)),ph=[];for(let i=0;i<pm.length;i++){const s=text.slice(pm[i].index,i+1<pm.length?pm[i+1].index:text.length),p=parseSection(s,pm[i][1],pm[i][2]);if(p.rows.length||p.total_fase)ph.push(p)}if(!ph.length)throw Error("Nenhuma fase/O.S. foi localizada no formato esperado.");const ref=em?parseDate(em[1]):dateKey(today()),rows=ph.flatMap(p=>p.rows).map(r=>enrich(r,ref));return{id:crypto.randomUUID(),file:file.name,emissao:em?parseDate(em[1])+"T"+em[2]:"",referencia:rm?rm[1]:"",multi_fase:ph.length>1,fase_num:ph.length===1?ph[0].fase_num:"",fase_nome:ph.length===1?ph[0].fase_nome:"MULTIFASE",ref_date:ref,rows,phases:ph,created_at:new Date().toISOString(),status_counts:count(rows)}}
function rowClass(s){return"st-"+norm(s).replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"")}
function table(rows,obs){if(!rows.length)return'<div class="empty">Nenhum registro encontrado.</div>';let h='<div class="tablewrap"><table class="tbl"><thead><tr><th>Etapa</th><th>O.S.</th><th>Cliente</th><th>Marca</th><th>Pot.</th><th>Tensão</th><th>Prev.</th><th>Status</th><th>Dias Fase</th><th>Colaborador</th>';if(obs)h+='<th>OBS</th>';h+='</tr></thead><tbody>';for(const r of rows){h+='<tr class="'+rowClass(r.Status)+'"><td>'+esc(r["Fase Nome"])+'</td><td><b>'+esc(r.OS)+'</b></td><td>'+esc(r.Cliente||"N/I")+'</td><td>'+esc(r.Marca||"N/I")+'</td><td>'+esc(r["Potência"]||"N/I")+'</td><td>'+esc(r["Tensão"]||"N/I")+'</td><td>'+dateFmt(r["Prev. Entrega"])+'</td><td>'+esc(r.Status)+'</td><td>'+(r["Dias na Fase"]??"-")+'</td><td>'+esc(r.Colaborador||"Não informado")+'</td>';if(obs)h+='<td class="obs">&nbsp;</td>';h+='</tr>'}return h+'</tbody></table></div>'}
function nav(p){state.page=p;$$(".page").forEach(x=>x.classList.remove("on"));$("#"+p).classList.add("on");$$("nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));const titles={inicio:"Início",relatorios:"Gerar Relatórios",consultas:"Consultas PCP",atrasos:"Gestão de Atrasos",historico:"Histórico",config:"Configurações",sobre:"Sobre"};$("#pageTitle").textContent=titles[p];renderPage(p)}
function renderPage(p){if(p==="inicio")renderHome();if(p==="relatorios")renderReports();if(p==="consultas")renderQueries();if(p==="atrasos")renderDelays();if(p==="historico")renderHistory();if(p==="config")renderConfig();if(p==="sobre")renderAbout()}
function render(){nav(state.page)}

<script type="module">
(async()=>{
  const setStatus=(msg)=>{
    const el=document.querySelector("#topStatus");
    if(el) el.textContent=msg;
  };
  const cfg=window.ESA_FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||String(cfg.apiKey).startsWith("COLOQUE_")) return;

  try{
    const [{initializeApp},{getAuth,signInAnonymously},{getFirestore,collection,getDocs,doc,setDoc,deleteDoc}]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js")
    ]);

    setStatus("Conectando ao Firebase...");
    const app=initializeApp(cfg);
    const auth=getAuth(app);
    const db=getFirestore(app);
    await signInAnonymously(auth);

    const key="gerador_pcp_esa_web_v1";
    const docId=k=>String(k).replace(/[^A-Za-z0-9_-]/g,"_");
    const hasData=d=>["motivo","observacao","responsavel","acao","prazo"].some(k=>String(d?.[k]||"").trim()!=="");

    async function loadCloud(){
      const raw=localStorage.getItem(key);
      const local=raw?JSON.parse(raw):{reports:[],delays:{},history:[]};
      const snap=await getDocs(collection(db,"gestao_atrasos"));
      const remote={};
      snap.forEach(s=>{
        const x=s.data()||{}, k=x.key||s.id;
        remote[k]={
          motivo:x.motivo||"",
          observacao:x.observacao||"",
          responsavel:x.responsavel||"",
          acao:x.acao||"",
          prazo:x.prazo||""
        };
      });
      const merged={...local.delays,...remote};
      const changed=JSON.stringify(merged)!==JSON.stringify(local.delays||{});
      local.delays=merged;
      localStorage.setItem(key,JSON.stringify(local));
      if(changed && sessionStorage.getItem("esa_firebase_merged")!=="1"){
        sessionStorage.setItem("esa_firebase_merged","1");
        location.reload();
        return;
      }
    }

    await loadCloud();
    setStatus("Firebase conectado");

    let timer=0;
    window.addEventListener("esa:local-save",()=>{
      clearTimeout(timer);
      timer=setTimeout(async()=>{
        try{
          const raw=localStorage.getItem(key);
          const local=raw?JSON.parse(raw):{delays:{}};
          for(const [k,d] of Object.entries(local.delays||{})){
            const ref=doc(db,"gestao_atrasos",docId(k));
            if(!hasData(d)) await deleteDoc(ref);
            else await setDoc(ref,{
              key:k,
              motivo:d.motivo||"",
              observacao:d.observacao||"",
              responsavel:d.responsavel||"",
              acao:d.acao||"",
              prazo:d.prazo||"",
              updatedAt:new Date().toISOString()
            },{merge:true});
          }
        }catch(e){
          console.error("Firebase save:",e);
          setStatus("Firebase: erro ao salvar");
        }
      },250);
    });
  }catch(e){
    console.error("Firebase:",e);
    setStatus("Firebase indisponível: "+(e?.code||e?.message||"erro"));
  }
})();
</script>
