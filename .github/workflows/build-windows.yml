name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "Aplicacao/**"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name Gerador_PCP_ESA --icon Aplicacao/icones/ESA_PCP.ico --add-data "Aplicacao/icones;icones" Aplicacao/Gerador_PCP.pyw

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Gerador_PCP_ESA-Windows
          path: dist/Gerador_PCP_ESA.exe
